 <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/contact.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Sweet Bakery</title>
    <script src="assets/js/login.js" defer></script>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-icon">
                <img src="assets/images/logo4.png" alt="Sweet Bakery Logo">
            </div>
            <span>Sweet Bakery</span>
            <nav>
                <a href="index.html">Home</a>
                <a href="categories.html">Categories</a>
                <a href="aboutus.html">About Us</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="#" id="loginLink">Login</a>
                <a href="cart.html" class="icon-cart" title="Cart">
                    <img src="assets/images/icon-cart.png" alt="Cart">
                </a>
            </nav>
        </div>
    </header>

    <main>   
        <center> <h2>Contact Us</h2> </center>
        <div class="contact-box">
            
            <div class="contact-item">
                <span class="contact-icon"><i class="fa-solid fa-phone"></i></span>
                <span>+63 912 345 6789</span>
            </div>
        
            <div class="contact-item">
                <span class="contact-icon"><i class="fa-solid fa-envelope"></i></span>
                <span>hello@sweetbakery.com</span>
            </div>
        
            <div class="contact-item">
                <span class="contact-icon"><i class="fa-solid fa-globe"></i></span>
                <span>www.sweetbakery.com</span>
            </div>
        
            <div class="contact-item">
                <span class="contact-icon"><i class="fa-solid fa-location-dot"></i></span>
                <span>123 Baker Street, Your City</span>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sweet Bakery. All rights reserved.</p>
    </footer>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <button class="modal-close" id="closeModal" aria-label="Close">&times;</button>
            <h2 id="modalTitle">Login</h2>
            <form id="loginForm" novalidate>
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Email">
                <small class="error" id="emailError"></small>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password">
                <small class="error" id="passwordError"></small>

                <div id="confirmGroup" class="hidden">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password">
                    <small class="error" id="confirmError"></small>
                </div>

                <button type="submit" class="login-btn" id="submitBtn">Log In</button>
                <p class="success" id="loginSuccess"></p>
                <p class="switch-text">
                    <span id="switchText">No account yet?</span>
                    <a href="#" id="switchMode">Sign Up</a>
                </p>
            </form>
        </div>
    </div>

</body>
</html>
